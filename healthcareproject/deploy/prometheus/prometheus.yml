# Scrape config for every service's Prometheus endpoint (exposed via
# libs/metrics_shared, see services/*/app/main.py). analytics uses
# /prom-metrics specifically because /metrics on that service is already
# its own business-metrics endpoint (total_patients, appointments_booked,
# ...) — see analytics/app/main.py's comment on instrument_metrics().
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: profiles
    static_configs:
      - targets: ["profiles:8000"]

  - job_name: booking
    static_configs:
      - targets: ["booking:8000"]

  - job_name: billing
    static_configs:
      - targets: ["billing:8000"]

  - job_name: analytics
    metrics_path: /prom-metrics
    static_configs:
      - targets: ["analytics:8000"]

  - job_name: notification
    static_configs:
      - targets: ["notification:8000"]

  - job_name: audit
    static_configs:
      - targets: ["audit:8000"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: temporal
    static_configs:
      - targets: ["temporal:9090"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
