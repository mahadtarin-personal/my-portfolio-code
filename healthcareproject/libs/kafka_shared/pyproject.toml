[project]
name = "kafka_shared"
version = "0.1.0"
description = "Shared Kafka event schema, producer, and consumer helpers used across services (Week 3 event-driven system)."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
