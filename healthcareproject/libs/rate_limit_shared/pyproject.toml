[project]
name = "rate_limit_shared"
version = "0.1.0"
description = "Shared rate-limiting setup (slowapi) used across services that expose brute-force-able or abuse-prone endpoints."
requires-python = ">=3.12"
dependencies = ["slowapi>=0.1.9,<0.2", "fastapi"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
