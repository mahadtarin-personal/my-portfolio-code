[project]
name = "metrics_shared"
version = "0.1.0"
description = "Shared Prometheus metrics exposition (request rate, latency, in-progress, errors) used across every service (Week 3 observability)."
requires-python = ">=3.12"
dependencies = [
    "prometheus-fastapi-instrumentator>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
