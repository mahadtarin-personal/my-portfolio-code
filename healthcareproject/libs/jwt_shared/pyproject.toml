[project]
name = "jwt_shared"
version = "0.1.0"
description = "Shared JWT issue/verify helpers used by profiles and booking services."
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.8,<3.0",
    "cryptography>=42,<47",
    "fastapi",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
